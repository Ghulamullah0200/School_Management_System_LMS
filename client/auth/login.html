<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduPrime</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box animate-fade-in">
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none">
                    <h2 class="fw-bold text-primary mb-2"><i class="bi bi-mortarboard-fill me-2"></i>EduPrime</h2>
                </a>
                <p class="text-muted" id="loginRoleText">Please sign in to continue</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 bg-light" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-muted small fw-bold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 bg-light" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small text-muted" for="remember">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Sign In</button>
            </form>

            <div class="mt-4 text-center">
                <p class="small text-muted">Don't have an account? <a href="#" class="text-primary text-decoration-none">Contact Admin</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        // Simple Login Logic
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'admin';
        
        const roleNames = {
            'admin': 'Super Admin',
            'teacher': 'Teacher',
            'student': 'Student',
            'parent': 'Parent'
        };

        document.getElementById('loginRoleText').innerText = `Sign in to ${roleNames[role] || 'Dashboard'}`;

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Mock Redirect
            window.location.href = `/${role}/dashboard.html`;
        });
    </script>
</body>
</html>
