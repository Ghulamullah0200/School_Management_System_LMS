<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EduPrime</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box animate-fade-in">
            <div class="text-center mb-4">
                 <h2 class="fw-bold text-primary mb-2"><i class="bi bi-mortarboard-fill me-2"></i>EduPrime</h2>
                 <h5 class="mt-3">Forgot Password?</h5>
                 <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <form>
                <div class="mb-3">
                    <label for="email" class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 bg-light" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Send Reset Link</button>
            </form>

            <div class="mt-4 text-center">
                <a href="login.html" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
