<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPrime - School Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="./assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
        <div class="text-center mb-5 animate-fade-in">
            <h1 class="display-4 fw-bold text-primary mb-3">
                <i class="bi bi-mortarboard-fill me-2"></i>EduPrime
            </h1>
            <p class="lead text-muted">Next-Gen School Management ERP System</p>
        </div>

        <div class="row g-4 w-100 justify-content-center animate-fade-in" style="max-width: 1000px;">
            <!-- Admin -->
            <div class="col-md-6 col-lg-3">
                <a href="/auth/login.html?role=admin" class="text-decoration-none">
                    <div class="card h-100 role-card border-0 shadow-sm text-center p-4">
                        <div class="card-body">
                            <div class="mb-4">
                                <span class="badge bg-light-primary p-3 rounded-circle">
                                    <i class="bi bi-shield-lock-fill fs-2 text-primary"></i>
                                </span>
                            </div>
                            <h5 class="card-title text-dark fw-bold">Super Admin</h5>
                            <p class="card-text text-muted small">Full access to all modules and settings</p>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Teacher -->
            <div class="col-md-6 col-lg-3">
                <a href="/auth/login.html?role=teacher" class="text-decoration-none">
                    <div class="card h-100 role-card border-0 shadow-sm text-center p-4">
                        <div class="card-body">
                            <div class="mb-4">
                                <span class="badge bg-light-success p-3 rounded-circle">
                                    <i class="bi bi-person-video3 fs-2 text-success"></i>
                                </span>
                            </div>
                            <h5 class="card-title text-dark fw-bold">Teacher</h5>
                            <p class="card-text text-muted small">Manage classes, exams, and attendance</p>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Student -->
            <div class="col-md-6 col-lg-3">
                <a href="/auth/login.html?role=student" class="text-decoration-none">
                    <div class="card h-100 role-card border-0 shadow-sm text-center p-4">
                        <div class="card-body">
                            <div class="mb-4">
                                <span class="badge bg-light-info p-3 rounded-circle">
                                    <i class="bi bi-backpack-fill fs-2 text-info"></i>
                                </span>
                            </div>
                            <h5 class="card-title text-dark fw-bold">Student</h5>
                            <p class="card-text text-muted small">View results, routine, and notices</p>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Parent -->
            <div class="col-md-6 col-lg-3">
                <a href="/auth/login.html?role=parent" class="text-decoration-none">
                    <div class="card h-100 role-card border-0 shadow-sm text-center p-4">
                        <div class="card-body">
                            <div class="mb-4">
                                <span class="badge bg-light-warning p-3 rounded-circle">
                                    <i class="bi bi-people-fill fs-2 text-warning"></i>
                                </span>
                            </div>
                            <h5 class="card-title text-dark fw-bold">Parent</h5>
                            <p class="card-text text-muted small">Monitor child performance and fees</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div class="mt-5 text-muted small">
            &copy; 2024 EduPrime School ERP. All rights reserved.
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/main.js"></script>
</body>
</html>
